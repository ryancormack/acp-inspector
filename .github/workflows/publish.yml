name: Publish to NPM

# A release can only be created by someone with write access, so this cannot be
# triggered by an outside contributor. That is the gate; see the note on the job
# below for why there is no second approval step.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm provenance and for trusted publishing (OIDC). Granting it
  # alone confers nothing.
  id-token: write

# Never let two releases publish concurrently and land out of order.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` gate. Creating a release already requires write access, so
    # for a single maintainer an approval step adds a click without adding a
    # boundary. The controls that do carry weight live on npm: the trusted
    # publisher plus the "disallow bypass 2fa tokens" publishing-access option.
    #
    # To add the gate anyway: create an `npm-publish` environment with required
    # reviewers, add `environment: npm-publish` here, and name that environment on
    # the npm trusted publisher so the OIDC token is only issued after approval.
    steps:
      # Third-party and first-party actions are pinned to immutable SHAs. A tag
      # like `v4` is mutable: if it is repointed, or the action's repo is
      # compromised, the new code runs in the job that can mint a publish token.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: latest

      # --frozen-lockfile so a release can only ship the dependency versions that
      # were reviewed into the lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Builds the server and the UI, then runs the transcript unit tests and the
      # end-to-end smoke test against the stub agent. The UI bundle must be in
      # dist/ui or the published CLI serves a 404, so a failing build here is the
      # gate that matters.
      - name: Test
        run: pnpm test

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version

      # Authenticates by OIDC trusted publishing: pnpm exchanges the workflow's
      # id token for a short-lived npm token, so there is no credential in this
      # repository at all. It requires a trusted publisher configured on the
      # package's own npm settings page, naming this repo and this workflow file.
      # Renaming this file breaks publishing until npm is updated to match.
      #
      # --provenance attaches a signed SLSA attestation. It needs a public source
      # repository, which this is.
      - name: Publish to NPM
        run: pnpm publish --no-git-checks --provenance
