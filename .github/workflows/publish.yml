name: Publish to NPM

# A release can only be created by someone with write access, so this cannot be
# triggered by an outside contributor. That is the gate; see the note on the job
# below for why there is no second approval step.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm provenance and for trusted publishing (OIDC). Granting it
  # alone confers nothing.
  id-token: write

# Never let two releases publish concurrently and land out of order.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` gate. Creating a release already requires write access, so
    # for a single maintainer an approval step adds a click without adding a
    # boundary. The controls that do carry weight live on npm: a trusted publisher
    # plus the "disallow bypass 2fa tokens" publishing-access option.
    #
    # To add the gate anyway: create an `npm-publish` environment with required
    # reviewers, scope NPM_TOKEN to it, and add `environment: npm-publish` here.
    steps:
      # Third-party and first-party actions are pinned to immutable SHAs. A tag
      # like `v4` is mutable: if it is repointed, or the action's repo is
      # compromised, the new code runs in the one job that can see NPM_TOKEN.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: latest

      # --frozen-lockfile so a release can only ship the dependency versions that
      # were reviewed into the lockfile.
      #
      # NODE_AUTH_TOKEN is deliberately NOT set on this step: dependency install
      # scripts run here, and they have no business seeing the publish token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Builds the server and the UI, then runs the transcript unit tests and the
      # end-to-end smoke test against the stub agent. The UI bundle must be in
      # dist/ui or the published CLI serves a 404, so a failing build here is the
      # gate that matters.
      - name: Test
        run: pnpm test

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version

      # Phase 1 (first publish): authenticate with NPM_TOKEN. A trusted publisher
      # is configured on a package's own npm settings page, so it cannot be set up
      # until the package exists -- the first release has to use a token.
      #
      # Phase 2 (from the second release): configure the trusted publisher on npm,
      # then delete the `env:` block below and add `--provenance` to the command.
      # Publishing then needs no long-lived credential at all, which is how
      # ryancormack/strands-acp works today.
      #
      # The token is scoped to this single step, so it is never in the environment
      # while third-party install or build scripts are running.
      - name: Publish to NPM
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
