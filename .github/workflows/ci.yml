name: CI

# `pull_request`, NOT `pull_request_target`. This matters: `pull_request` runs a
# fork's code with a read-only token and no access to repository secrets, so a
# malicious PR can waste runner minutes and nothing else. `pull_request_target`
# would run that same untrusted code with write permissions and secrets in scope,
# which is the standard way public repos get their tokens stolen.
#
# This workflow uses no secrets at all, which is what makes it safe to run on
# arbitrary PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: latest

      # --frozen-lockfile: a PR cannot silently resolve dependency versions that
      # differ from the reviewed lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm test` builds first, so this also proves the published artifact
      # compiles: the smoke test boots the real CLI over a real websocket against
      # the stub agent.
      - name: Test
        run: pnpm test

      # Catches the failure mode a green test run would still hide: a `files` or
      # bin path that omits the UI bundle, so `npx` serves a 404.
      - name: Check the package tarball contains the CLI and the UI
        run: |
          pnpm pack
          TARBALL=$(ls ./*.tgz)
          echo "packed $TARBALL"
          tar -tzf "$TARBALL" | sort > /tmp/contents.txt
          sed 's/^/  /' /tmp/contents.txt | head -40
          for required in package/dist/server/cli.js package/dist/ui/index.html; do
            grep -qx "$required" /tmp/contents.txt || {
              echo "::error::$required missing from the published tarball"
              exit 1
            }
          done
          grep -q '^package/dist/ui/assets/' /tmp/contents.txt || {
            echo "::error::no built UI assets in the published tarball"
            exit 1
          }
